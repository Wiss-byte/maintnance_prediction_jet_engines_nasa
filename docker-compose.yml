name: pm-kappa

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_MS: -1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: {condition: service_healthy}
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic sensors.raw --partitions 3 --replication-factor 1 --config retention.ms=-1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic pg.public.engines --partitions 1 --replication-factor 1 --config retention.ms=-1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka: {condition: service_healthy}

  postgres:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      retries: 20

  connect:
    image: quay.io/debezium/connect:2.7
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}

  connect-init:
    image: curlimages/curl:8.9.1
    restart: "no"
    depends_on: [connect]
    volumes:
      - ./docker/connect/pg-engines.json:/cfg/pg-engines.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -sf http://connect:8083/connectors >/dev/null; do echo "waiting connect..."; sleep 5; done
        curl -s -X POST -H "Content-Type: application/json" --data @/cfg/pg-engines.json http://connect:8083/connectors || true

  mqtt-bridge:
    build: ./bridge
    environment:
      MQTT_HOST: mosquitto
      KAFKA: kafka:29092
      TOPIC: sensors.raw
    depends_on:
      mosquitto: {condition: service_started}
      kafka-init: {condition: service_completed_successfully}
    restart: unless-stopped

  simulator:
    build: ./simulator
    profiles: ["sim"]
    environment:
      MQTT_HOST: mosquitto
      PG_DSN: "host=postgres dbname=pm user=postgres password=postgres"
      N_ENGINES: ${SIM_ENGINES:-50}
      TICK: ${SIM_TICK:-1.0}
      MAX_ENGINES: ${SIM_MAX_ENGINES:-0}
      FAULTS: ${SIM_FAULTS:-1}
      PYTHONPATH: /app/shared
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      postgres: {condition: service_healthy}
      mosquitto: {condition: service_started}
      mqtt-bridge: {condition: service_started}

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    restart: "no"
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 minio minio12345; do sleep 2; done
        mc mb -p local/lakehouse local/mlflow
        exit 0

  spark:
    build: ./docker/spark
    container_name: spark
    user: root
    command: ["sleep", "infinity"]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      KAFKA: kafka:29092
      PYTHONPATH: /app/shared:/app/streaming:/app/quality:/app/governance
      SPARK_PACKAGES: io.delta:delta-spark_2.12:3.2.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.apache.hadoop:hadoop-aws:3.3.4,org.postgresql:postgresql:42.7.3
      GE_ENABLED: "1"
      DEBEZIUM_SALT: pmsalt
    volumes:
      - .:/app
      - ivy_cache:/tmp/ivy
    depends_on:
      minio-init: {condition: service_completed_successfully}

volumes:
  kafka_data:
  pg_data:
  minio_data:
  ivy_cache: